name: Hermes runtime compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - Dockerfile
      - deployments/hermes-dockhosting/Dockerfile
      - deployments/hermes-dockhosting/dockhosting-entrypoint.sh
      - deployments/hermes-dockhosting/p2p-post-bootstrap-main.sh
      - deployments/hermes-dockhosting/plugins/p2p-personal-behavior/**
      - deployments/hermes-dockhosting/plugins/notebooklm-knowledge/**
      - tests/test_hermes_notebooklm_knowledge.py
      - deployments/hermes-essential-stack/plugins/p2p-opik-observer/**
      - deployments/hermes-dockhosting/hindsight-p2p-safe.example.json
      - scripts/hermes_runtime_compatibility.py
      - tests/test_p2p_hermes_runtime_compatibility.py
      - tests/test_hermes_personal_behavior_runtime.py
      - tests/test_hermes_essential_stack_guard.py
      - .github/workflows/hermes-runtime-compatibility.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - deployments/hermes-dockhosting/Dockerfile
      - deployments/hermes-dockhosting/dockhosting-entrypoint.sh
      - deployments/hermes-dockhosting/p2p-post-bootstrap-main.sh
      - deployments/hermes-dockhosting/plugins/p2p-personal-behavior/**
      - deployments/hermes-dockhosting/plugins/notebooklm-knowledge/**
      - tests/test_hermes_notebooklm_knowledge.py
      - deployments/hermes-essential-stack/plugins/p2p-opik-observer/**
      - deployments/hermes-dockhosting/hindsight-p2p-safe.example.json
      - scripts/hermes_runtime_compatibility.py
      - tests/test_p2p_hermes_runtime_compatibility.py
      - tests/test_hermes_personal_behavior_runtime.py
      - tests/test_hermes_essential_stack_guard.py
      - .github/workflows/hermes-runtime-compatibility.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hermes-compat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: p2p-hermes-compat:${{ github.sha }}
      EXPECTED_TAG: v2026.9.14
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Run deterministic compatibility tests
        run: >-
          python3 -m unittest -v
          tests.test_p2p_hermes_runtime_compatibility
          tests.test_p2p_hermes_tool_bridges
          tests.test_hermes_personal_behavior_runtime
          tests.test_hermes_notebooklm_knowledge
          tests.test_hermes_essential_stack_guard

      - name: Verify both Dockerfiles pin the same release tag
        run: |
          test "$(head -n 3 Dockerfile | tail -n 1)" = "FROM nousresearch/hermes-agent:${EXPECTED_TAG}"
          test "$(head -n 3 deployments/hermes-dockhosting/Dockerfile | tail -n 1)" = "FROM nousresearch/hermes-agent:${EXPECTED_TAG}"
          ! grep -R '^FROM nousresearch/hermes-agent:latest$' Dockerfile deployments/hermes-dockhosting/Dockerfile

      - name: Build the actual DockHosting source image
        run: docker build --pull -t "$IMAGE" -f Dockerfile .

      - name: Record built image identity
        run: |
          echo "PINNED_BASE=nousresearch/hermes-agent:${EXPECTED_TAG}"
          docker image inspect "$IMAGE" --format '{{.Id}}'

      - name: Probe Hermes version and CLI contract
        run: |
          docker run --rm --entrypoint /opt/hermes/.venv/bin/hermes "$IMAGE" --version > "$RUNNER_TEMP/hermes-version.txt"
          docker run --rm --entrypoint /opt/hermes/.venv/bin/hermes "$IMAGE" --help > "$RUNNER_TEMP/hermes-help.txt"
          cat "$RUNNER_TEMP/hermes-version.txt"
          python3 scripts/hermes_runtime_compatibility.py cli \
            --version-file "$RUNNER_TEMP/hermes-version.txt" \
            --help-file "$RUNNER_TEMP/hermes-help.txt"

      - name: Verify Personal AI behavior plugin is bundled, enabled, and loaded
        run: |
          mkdir -p "$RUNNER_TEMP/personal-ai-home"
          chmod 0777 "$RUNNER_TEMP/personal-ai-home"
          docker run --rm --user 0:0 \
            -e HERMES_HOME=/tmp/hermes-home \
            -v "$RUNNER_TEMP/personal-ai-home:/tmp/hermes-home" \
            --entrypoint /bin/sh \
            "$IMAGE" -lc '
              set -eu
              test -f /opt/hermes/plugins/p2p-personal-behavior/plugin.yaml
              test -f /opt/hermes/plugins/p2p-personal-behavior/__init__.py
              test -f /opt/hermes/plugins/p2p-personal-behavior/personal_ai_behavior.py
              /opt/hermes/.venv/bin/hermes plugins enable p2p-personal-behavior
              grep -F "p2p-personal-behavior" /tmp/hermes-home/config.yaml
              /opt/hermes/.venv/bin/python -c "from hermes_cli.plugins import discover_plugins, get_plugin_manager; discover_plugins(force=True); manager=get_plugin_manager(); loaded=manager._plugins.get(\"p2p-personal-behavior\"); assert loaded is not None, \"plugin missing after discovery\"; assert loaded.enabled is True, \"plugin discovered but not enabled\"; assert loaded.error is None, f\"plugin load error: {loaded.error}\"; assert \"pre_llm_call\" in loaded.hooks_registered; assert \"transform_llm_output\" in loaded.hooks_registered; assert \"p2p-personal-behavior.voice\" in manager._system_prompt_sections; print(\"P2P_PERSONAL_BEHAVIOR_RUNTIME=LOADED\")"
            '

      - name: Verify NotebookLM knowledge plugin is bundled and exact-pinned
        run: |
          docker run --rm --entrypoint /bin/sh "$IMAGE" -lc '
            set -eu
            test -f /opt/hermes/plugins/notebooklm-knowledge/plugin.yaml
            test -f /opt/hermes/plugins/notebooklm-knowledge/__init__.py
            test -f /opt/hermes/plugins/notebooklm-knowledge/tools.py
            /opt/hermes/.venv/bin/python -c "import importlib.metadata; assert importlib.metadata.version(\"notebooklm-py\") == \"0.8.2\"; print(\"NOTEBOOKLM_PY_PIN=PASS\")"
          '

      - name: Verify Opik observer is bundled but dependency and telemetry stay off by default
        run: |
          docker run --rm --entrypoint /bin/sh "$IMAGE" -lc '
            set -eu
            test -f /opt/hermes/plugins/p2p-opik-observer/plugin.yaml
            test -f /opt/hermes/plugins/p2p-opik-observer/__init__.py
            if /opt/hermes/.venv/bin/python -c "import opik" >/dev/null 2>&1; then
              echo "OPIK_SDK_UNEXPECTEDLY_PRESENT_IN_DEFAULT_IMAGE" >&2
              exit 2
            fi
            test "${P2P_ENABLE_OPIK:-NO}" = "NO"
            echo "OPIK_REUSABLE_PLUGIN_BUNDLED_DEFAULT_OFF=PASS"
          '

      - name: Probe Hermes state.db for TokScale read-only compatibility
        run: |
          mkdir -p "$RUNNER_TEMP/hermes-home"
          chmod 0777 "$RUNNER_TEMP/hermes-home"
          # The throwaway container runs as root. Create the real Hermes DB, then
          # relax read permission on this CI scratch copy from inside that same
          # root namespace before exit. Production state permissions stay intact.
          docker run --rm --user 0:0 \
            -e HERMES_HOME=/tmp/hermes-home \
            -v "$RUNNER_TEMP/hermes-home:/tmp/hermes-home" \
            --entrypoint /bin/sh \
            "$IMAGE" -lc '/opt/hermes/.venv/bin/hermes sessions list; chmod a+r /tmp/hermes-home/state.db*'
          test -f "$RUNNER_TEMP/hermes-home/state.db"
          python3 scripts/hermes_runtime_compatibility.py state-db "$RUNNER_TEMP/hermes-home/state.db"

      - name: Verify bundled Hindsight provider exists but remains unconfigured
        run: |
          docker run --rm --entrypoint /bin/sh "$IMAGE" -lc 'test -f /opt/hermes/plugins/memory/hindsight/README.md'
          python3 - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path('deployments/hermes-dockhosting/hindsight-p2p-safe.example.json').read_text())
          assert cfg['auto_retain'] is False
          assert cfg['auto_recall'] is False
          assert cfg['memory_mode'] == 'tools'
          assert cfg['recall_types'] == 'observation'
          print('HINDSIGHT_SAFE_PROFILE=PASS')
          PY
