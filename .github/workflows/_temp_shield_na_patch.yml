name: temp Shield CI applicability patch

on:
  push:
    branches: [control-tower/shield-ci-applicability-v1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Apply bounded patch and test
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          w="$(mktemp -d)"; trap 'rm -rf "$w"' EXIT
          git clone -q --branch "$BRANCH" "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "$w/repo"
          cd "$w/repo"
          python3 - <<'PY'
          from pathlib import Path
          import json

          c=Path('shield/controls/SHIELD-CI-01.json'); d=json.loads(c.read_text())
          d['control_version']='0.2.0'
          d['status_semantics']['NOT_APPLICABLE']='Target has no GitHub Actions workflow definitions in .github/workflows; deterministic target-shape applicability is established before provider execution. This is not PASS.'
          d['limitations']=[x.replace('Workflow inventory certainty is required: zero workflows, indeterminate collection, or provider error is BLOCKED, not PASS.','Workflow inventory certainty is required when workflows exist. Deterministically empty .github/workflows inventory is NOT_APPLICABLE, never PASS; indeterminate inventory or provider error remains BLOCKED.') for x in d['limitations']]
          d['non_negotiable']['not_applicable_requires_deterministic_empty_target_inventory']=True
          c.write_text(json.dumps(d,indent=2)+'\n')

          p=Path('shield/profiles/SHIELD-BASE.json'); d=json.loads(p.read_text())
          d['profile_version']='0.3.0'; d['required_controls']['SHIELD-CI-01']['control_version']='0.2.0'; d['required_controls']['SHIELD-CI-01']['allow_not_applicable_by_target_shape']=True
          p.write_text(json.dumps(d,indent=2)+'\n')

          p=Path('shield/ci.py'); s=p.read_text().replace('CONTROL_VERSION = "0.1.0"','CONTROL_VERSION = "0.2.0"')
          old='''        # Verify executable version (also checks pin)\n        try:\n            observed = zizmor_acquire.verify_executable(executable)\n        except Exception as exc:\n            # If verify_executable fails due to missing receipt but version still checkable, try direct version\n            # zizmor_acquire.version already raises appropriate error\n            raise\n        e["provider_version_observed"] = observed\n'''
          new='''        workflows_root = target / ".github" / "workflows"\n        if workflows_root.exists() and (workflows_root.is_symlink() or not workflows_root.is_dir()):\n            raise ValueError("WORKFLOW_INVENTORY_INDETERMINATE:workflows_root_not_regular_directory")\n        workflow_files = []\n        if workflows_root.is_dir():\n            for pattern in ("*.yml", "*.yaml"):\n                for candidate in workflows_root.glob(pattern):\n                    if candidate.is_symlink() or not candidate.is_file():\n                        raise ValueError("WORKFLOW_INVENTORY_INDETERMINATE:workflow_not_regular_file")\n                    workflow_files.append(candidate)\n        if not workflow_files:\n            e.update(status="NOT_APPLICABLE", findings_count=0, findings=[], coverage=["NOT_APPLICABLE_BY_TARGET_SHAPE"], reason="TARGET_SHAPE_HAS_NO_GITHUB_ACTIONS_WORKFLOWS", applicability={"basis":"DETERMINISTIC_EMPTY_WORKFLOW_INVENTORY","path":".github/workflows","workflow_count":0})\n            return e\n        observed = zizmor_acquire.verify_executable(executable)\n        e["provider_version_observed"] = observed\n'''
          assert old in s; s=s.replace(old,new)
          s=s.replace("raise SystemExit({'PASS': 0, 'FAIL': 1, 'BLOCKED': 2}[evidence['status']])","raise SystemExit({'PASS': 0, 'NOT_APPLICABLE': 0, 'FAIL': 1, 'BLOCKED': 2}[evidence['status']])")
          p.write_text(s)

          p=Path('shield/profile.py'); s=p.read_text().replace("e['status'] not in ('PASS', 'FAIL', 'BLOCKED')","e['status'] not in ('PASS', 'FAIL', 'BLOCKED', 'NOT_APPLICABLE')")
          old="""            if e['status'] != 'BLOCKED' and 'NONE_ESTABLISHED' in e['coverage']:\n                return result\n            if (e['status'] == 'PASS' and count != 0) or (e['status'] == 'FAIL' and count < 1):\n                return result\n            statuses.append(e['status'])\n"""
          new="""            if e['status'] != 'BLOCKED' and 'NONE_ESTABLISHED' in e['coverage']:\n                return result\n            if (e['status'] == 'PASS' and count != 0) or (e['status'] == 'FAIL' and count < 1):\n                return result\n            if e['status'] == 'NOT_APPLICABLE':\n                rule = PROFILE['required_controls'][e['control_id']]\n                if rule.get('allow_not_applicable_by_target_shape') is not True:\n                    return result\n                if count != 0 or e['coverage'] != ['NOT_APPLICABLE_BY_TARGET_SHAPE'] or e['reason'] != 'TARGET_SHAPE_HAS_NO_GITHUB_ACTIONS_WORKFLOWS':\n                    return result\n                a=e.get('applicability')\n                if not isinstance(a,dict) or a.get('basis')!='DETERMINISTIC_EMPTY_WORKFLOW_INVENTORY' or a.get('path')!='.github/workflows' or a.get('workflow_count')!=0:\n                    return result\n            statuses.append(e['status'])\n"""
          assert old in s; s=s.replace(old,new)
          old="""        result['PROFILE_REQUIREMENTS_STATUS'] = ('FAIL' if 'FAIL' in statuses else\n                                                  'BLOCKED' if 'BLOCKED' in statuses else 'PASS')\n        result['reason'] = 'REQUIRED_SCOPED_EVIDENCE_COMPOSED_ONLY'\n"""
          new="""        result['PROFILE_REQUIREMENTS_STATUS'] = ('FAIL' if 'FAIL' in statuses else\n                                                  'BLOCKED' if 'BLOCKED' in statuses else 'PASS')\n        result['NOT_APPLICABLE_CONTROLS'] = sorted({e['control_id'] for e in records if e.get('status') == 'NOT_APPLICABLE'})\n        result['reason'] = ('REQUIRED_APPLICABLE_SCOPED_EVIDENCE_COMPOSED' if result['NOT_APPLICABLE_CONTROLS'] else 'REQUIRED_SCOPED_EVIDENCE_COMPOSED_ONLY')\n"""
          assert old in s; p.write_text(s.replace(old,new))

          p=Path('tests/test_p2p_shield_ci_slice.py'); s=p.read_text()
          s=s.replace('self.assertEqual(control["control_version"], "0.1.0")','self.assertEqual(control["control_version"], "0.2.0")')
          s=s.replace('self.assertEqual(set(control["status_semantics"].keys()), {"PASS", "FAIL", "BLOCKED"})','self.assertEqual(set(control["status_semantics"].keys()), {"PASS", "FAIL", "BLOCKED", "NOT_APPLICABLE"})')
          s=s.replace('self.assertEqual(PROFILE["profile_version"], "0.2.1")','self.assertEqual(PROFILE["profile_version"], "0.3.0")')
          s=s.replace('control_version="0.1.0",','control_version=rule["control_version"],')
          p.write_text(s)
          p=Path('tests/test_p2p_shield_base_slice.py'); p.write_text(p.read_text().replace("control_id=c, control_version='0.1.0',","control_id=c, control_version=rule['control_version'],"))
          p=Path('tests/test_p2p_release_packaging.py'); p.write_text(p.read_text().replace('case.assertEqual(probe["profile_version"], "0.2.1")','case.assertEqual(probe["profile_version"], "0.3.0")'))

          Path('tests/test_p2p_shield_applicability.py').write_text('''import copy, os, subprocess, tempfile, unittest\nfrom pathlib import Path\nfrom unittest.mock import patch\nfrom shield import ci\nfrom shield.profile import evaluate, PROFILE\nfrom shield.runner import resolve_target_ref\n\ndef init(r):\n e={**os.environ,'GIT_AUTHOR_NAME':'f','GIT_AUTHOR_EMAIL':'f@x','GIT_COMMITTER_NAME':'f','GIT_COMMITTER_EMAIL':'f@x','GIT_CONFIG_GLOBAL':os.devnull,'GIT_CONFIG_SYSTEM':os.devnull}; subprocess.run(['git','init','-q'],cwd=r,check=True,env=e); subprocess.run(['git','add','-A'],cwd=r,check=True,env=e); subprocess.run(['git','-c','commit.gpgsign=false','commit','-qm','f'],cwd=r,check=True,env=e)\nclass T(unittest.TestCase):\n def setUp(self): self.t=tempfile.TemporaryDirectory(); self.addCleanup(self.t.cleanup); self.root=Path(self.t.name)\n def repo(self,w=False):\n  r=self.root/('w' if w else 'e'); r.mkdir(); (r/'README.md').write_text('x')\n  if w: d=r/'.github/workflows'; d.mkdir(parents=True); (d/'ci.yml').write_text('name: ci\\non: push\\njobs:\\n  x:\\n    runs-on: ubuntu-latest\\n    steps: []\\n')\n  init(r); return r\n def records(self,r,c):\n  ref=resolve_target_ref(r); out=[]\n  for cid,rule in PROFILE['required_controls'].items():\n   for scope in rule['required_scopes']:\n    out.append(c if cid=='SHIELD-CI-01' else dict(schema='p2p-shield-evidence/1',control_id=cid,control_version=rule['control_version'],scope=scope,target=str(r),target_ref=ref,timestamp='2026-09-15T00:00:00Z',status='PASS',findings_count=0,coverage=['assessed'],limitations=[],provider='p',provider_version='1',provider_source='u@t',reason='assessed',artifact_or_reference='run'))\n  return out\n def test_na_passes_profile_only_for_empty_inventory(self):\n  r=self.repo();\n  with patch('shield.ci.zizmor_acquire.verify_executable',side_effect=AssertionError('provider must not run')): e=ci.assess(r,self.root/'missing','run')\n  self.assertEqual(e['status'],'NOT_APPLICABLE'); q=evaluate(self.records(r,e),r,resolve_target_ref(r)); self.assertEqual(q['PROFILE_REQUIREMENTS_STATUS'],'PASS'); self.assertEqual(q['NOT_APPLICABLE_CONTROLS'],['SHIELD-CI-01']); self.assertEqual(q['SYSTEM_SECURITY_VERDICT'],'NOT_EVALUATED')\n def test_forged_na_blocked(self):\n  r=self.repo(); e=ci.assess(r,self.root/'missing','run')\n  for m in ({'coverage':['x']},{'findings_count':1},{'reason':'x'},{'applicability':{'basis':'x','path':'.github/workflows','workflow_count':0}}):\n   f=copy.deepcopy(e); f.update(m); self.assertEqual(evaluate(self.records(r,f),r,resolve_target_ref(r))['PROFILE_REQUIREMENTS_STATUS'],'BLOCKED')\n def test_applicable_missing_provider_stays_blocked(self):\n  r=self.repo(True); e=ci.assess(r,self.root/'missing','run'); self.assertEqual(e['status'],'BLOCKED'); self.assertEqual(evaluate(self.records(r,e),r,resolve_target_ref(r))['PROFILE_REQUIREMENTS_STATUS'],'BLOCKED')\n''')
          PY
          python -m unittest tests.test_p2p_shield_applicability tests.test_p2p_shield_base_slice tests.test_p2p_shield_ci_slice
          git rm .github/workflows/_temp_shield_na_patch.yml
          git add shield tests
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'Shield: model CI target-shape non-applicability'
          git push origin HEAD:"$BRANCH"
