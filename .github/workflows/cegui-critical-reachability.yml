name: CEGUI Critical Reachability

on:
  push:
    branches:
      - control-tower/cegui-critical-reachability-01
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout pinned plum-cg
        uses: actions/checkout@v4
        with:
          repository: soom-lupulus/plum-cg
          ref: 509fc43001a503d17a37db07bc56e069b1ff1c4f
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install exact lockfile
        run: npm ci

      - name: Capture critical audit facts
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > critical-audit.json || true
          node <<'NODE' | tee critical-summary.txt
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('critical-audit.json','utf8'));
          const critical = Object.entries(audit.vulnerabilities || {})
            .filter(([,v]) => v.severity === 'critical')
            .sort(([a],[b]) => a.localeCompare(b));
          console.log(`CRITICAL_PACKAGE_COUNT=${critical.length}`);
          for (const [name,v] of critical) {
            console.log(`CRITICAL_PACKAGE=${name}`);
            console.log(`DIRECT=${v.isDirect}`);
            console.log(`RANGE=${v.range}`);
            console.log(`NODES=${(v.nodes || []).join(',')}`);
            for (const via of v.via || []) {
              if (typeof via === 'string') console.log(`VIA_PACKAGE=${via}`);
              else console.log(`VIA_ADVISORY=${via.source}|${via.name}|${via.severity}|${via.url}|${via.range}`);
            }
          }
          if (critical.length !== 2) {
            console.error(`Expected exactly 2 critical packages from the locked baseline, got ${critical.length}`);
            process.exit(1);
          }
          NODE
          : > dependency-paths.txt
          for pkg in $(node -e "const a=require('./critical-audit.json'); console.log(Object.entries(a.vulnerabilities||{}).filter(([,v])=>v.severity==='critical').map(([k])=>k).join(' '))"); do
            echo "===== npm explain $pkg =====" | tee -a dependency-paths.txt
            npm explain "$pkg" | tee -a dependency-paths.txt
          done

      - name: Verify CEGUI fixture still builds and tests
        shell: bash
        run: |
          set -euo pipefail
          npx vitest run
          npm run typecheck
          npm run build
          test -s dist/index.esm.js
          echo 'CEGUI_UPSTREAM_UNIT_TYPECHECK_BUILD=PASS'

      - name: Upload reachability evidence
        uses: actions/upload-artifact@v4
        with:
          name: cegui-critical-reachability
          path: |
            critical-audit.json
            critical-summary.txt
            dependency-paths.txt
          if-no-files-found: error
