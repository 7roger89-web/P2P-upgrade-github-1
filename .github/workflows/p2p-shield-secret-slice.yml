# P2P Shield v0.1 - Slice 1 acceptance harness. CANDIDATE infrastructure on the
# Shield branch; NOT a promoted P2P workflow.
#
# Purpose: run exactly one thing - the SHIELD-SECRET-01 vertical-slice
# acceptance on a GitHub-hosted runner, because the authoring sandbox cannot
# reach the official provider release host. This is an execution harness, not a
# security platform: no build matrix, no cache, no artifact service, no
# third-party actions, no write token, no deployment, no cloud credentials.
#
# Provider policy: official Gitleaks release only, exact pinned version, sha256
# verified against the release checksums asset before any execution. No mirrors,
# no auto-upgrade, no source build. If acquisition or verification fails the
# provider is never used and the slice is reported as BLOCKED.
name: P2P Shield - SHIELD-SECRET-01 slice acceptance

on:
  push:
    # Candidate branch only, so the acceptance runs before any merge decision.
    branches:
      - arena/01a0901c-p2p-upgrade-github-1

permissions:
  contents: read

jobs:
  shield-secret-slice:
    name: SHIELD-SECRET-01 via pinned Gitleaks provider
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAPPING: shield/providers/gitleaks-8.18.4.json
      EXPECTED_PROVIDER_VERSION: 8.18.4
      PROVIDER_DIR: ${{ runner.temp }}/p2p-shield-provider
      WORK_DIR: ${{ runner.temp }}/p2p-shield-work
      EVIDENCE_DIR: ${{ runner.temp }}/p2p-shield-evidence
      EVIDENCE_REFERENCE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/attempts/${{ github.run_attempt }}
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the pinned provider from the Shield mapping
        run: |
          test -f "$MAPPING"
          python3 - "$MAPPING" "$EXPECTED_PROVIDER_VERSION" <<'PY'
          import json
          import os
          import pathlib
          import sys

          mapping_path, expected = pathlib.Path(sys.argv[1]), sys.argv[2]
          mapping = json.loads(mapping_path.read_text(encoding="utf-8"))
          source = mapping["source"]
          problems = []
          if mapping.get("control_id") != "SHIELD-SECRET-01":
              problems.append("MAPPING_CONTROL_ID_UNEXPECTED:%s" % mapping.get("control_id"))
          if mapping["provider_version"] != expected:
              problems.append(
                  "MAPPING_PROVIDER_VERSION_NOT_PINNED:%s!=%s" % (mapping["provider_version"], expected)
              )
          if source["kind"] != "official_github_release":
              problems.append("MAPPING_SOURCE_UNSUPPORTED:%s" % source["kind"])
          if source["tag"] != "v%s" % expected:
              problems.append("MAPPING_SOURCE_TAG_UNEXPECTED:%s" % source["tag"])
          if source["download_base"] != "https://github.com/gitleaks/gitleaks/releases/download/v%s" % expected:
              problems.append("MAPPING_DOWNLOAD_BASE_UNEXPECTED:%s" % source["download_base"])
          if "sha256" not in source["integrity_rule"]:
              problems.append("MAPPING_INTEGRITY_RULE_MISSING")
          if mapping["failure_behavior"] != "BLOCKED":
              problems.append("MAPPING_FAILURE_BEHAVIOR_UNSUPPORTED:%s" % mapping["failure_behavior"])
          if problems:
              for problem in problems:
                  print("::error::%s" % problem)
              raise SystemExit(1)
          outputs = {
              "GITLEAKS_VERSION": expected,
              "GITLEAKS_DOWNLOAD_BASE": source["download_base"],
              "GITLEAKS_ASSET": source["linux_x64_asset"],
              "GITLEAKS_CHECKSUMS_ASSET": source["checksums_asset"],
              "GITLEAKS_BINARY": source["extracted_binary"],
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              for key, value in outputs.items():
                  handle.write("%s=%s\n" % (key, value))
                  print("%s=%s" % (key, value))
          PY
          sha256sum "$MAPPING"

      - name: Acquire and verify the official provider release
        id: acquire
        continue-on-error: true
        run: |
          rm -rf "$PROVIDER_DIR"
          mkdir -p "$PROVIDER_DIR"
          cd "$PROVIDER_DIR"
          echo "== download the official checksums asset =="
          curl -fsSL --retry 3 --retry-delay 2 \
            -o "$GITLEAKS_CHECKSUMS_ASSET" \
            "$GITLEAKS_DOWNLOAD_BASE/$GITLEAKS_CHECKSUMS_ASSET"
          echo "== download the official provider archive =="
          curl -fsSL --retry 3 --retry-delay 2 \
            -o "$GITLEAKS_ASSET" \
            "$GITLEAKS_DOWNLOAD_BASE/$GITLEAKS_ASSET"
          echo "== verify sha256 against the official checksums entry =="
          EXPECTED=$(awk -v asset="$GITLEAKS_ASSET" '$2 == asset { print $1; exit }' "$GITLEAKS_CHECKSUMS_ASSET")
          if [ -z "$EXPECTED" ]; then
            echo "::error::PROVIDER_CHECKSUM_ENTRY_MISSING:$GITLEAKS_ASSET"
            exit 1
          fi
          ACTUAL=$(sha256sum "$GITLEAKS_ASSET" | awk '{print $1}')
          echo "expected_sha256=$EXPECTED"
          echo "actual_sha256=$ACTUAL"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::PROVIDER_CHECKSUM_MISMATCH - provider must not be used"
            rm -f "$GITLEAKS_ASSET"
            exit 1
          fi
          echo "== extract the verified archive and capture the provider version =="
          tar -xzf "$GITLEAKS_ASSET" -C "$PROVIDER_DIR"
          test -f "$PROVIDER_DIR/$GITLEAKS_BINARY"
          chmod +x "$PROVIDER_DIR/$GITLEAKS_BINARY"
          VERSION_OUTPUT=$("$PROVIDER_DIR/$GITLEAKS_BINARY" version)
          echo "gitleaks_version_output=$VERSION_OUTPUT"
          if [ "${VERSION_OUTPUT#v}" != "$GITLEAKS_VERSION" ]; then
            echo "::error::PROVIDER_VERSION_MISMATCH:observed=$VERSION_OUTPUT:pinned=$GITLEAKS_VERSION"
            exit 1
          fi
          echo "PROVIDER_ACQUIRE=VERIFIED_SHA256_VERSION_PINNED"
          echo "provider_sha256=$ACTUAL" >> "$GITHUB_OUTPUT"

      - name: Run focused Shield contract and runner tests
        run: python3 -m unittest -v tests.test_p2p_shield_secret_slice

      - name: Run Slice 1 acceptance against the pinned provider
        run: |
          if [ "${{ steps.acquire.outcome }}" != "success" ]; then
            echo "::warning::PROVIDER_ACQUIRE_FAILED - the required provider is unavailable, so every case must come out BLOCKED"
          fi
          mkdir -p "$WORK_DIR" "$EVIDENCE_DIR"
          echo "PROVIDER_EXECUTABLE=$PROVIDER_DIR/$GITLEAKS_BINARY"
          echo "PROVIDER_EXECUTABLE_PRESENT=$([ -x "$PROVIDER_DIR/$GITLEAKS_BINARY" ] && echo YES || echo NO)"
          python3 -m shield.acceptance \
            --executable "$PROVIDER_DIR/$GITLEAKS_BINARY" \
            --work-dir "$WORK_DIR" \
            --evidence-dir "$EVIDENCE_DIR" \
            --evidence-reference "$EVIDENCE_REFERENCE" \
            --timeout-seconds 600

      - name: Report the evidence records (durable in this run log)
        if: always()
        run: |
          python3 - "$EVIDENCE_DIR" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json
          import pathlib
          import sys

          directory = pathlib.Path(sys.argv[1])
          records = sorted(directory.glob("slice1-*.json")) if directory.is_dir() else []
          print("### SHIELD-SECRET-01 slice acceptance\n")
          print("| case | scope | status | findings | provider | reason |")
          print("| --- | --- | --- | --- | --- | --- |")
          for path in records:
              evidence = json.loads(path.read_text(encoding="utf-8"))
              print(
                  "| %s | %s | %s | %s | %s %s | %s |"
                  % (
                      path.name[len("slice1-"):-len(".json")],
                      evidence.get("scope", "-"),
                      evidence.get("status", "-"),
                      evidence.get("findings_count", "-"),
                      evidence.get("provider", "-"),
                      evidence.get("provider_version", "-"),
                      str(evidence.get("reason", "-"))[:80],
                  )
              )
          print("")
          print("Evidence records: %d, printed in full in the job log." % len(records))
          PY
          echo "=== evidence records ==="
          for record in "$EVIDENCE_DIR"/slice1-*.json; do
            [ -e "$record" ] || break
            echo "--- $record"
            cat "$record"
          done
