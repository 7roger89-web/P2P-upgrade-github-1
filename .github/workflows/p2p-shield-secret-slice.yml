# P2P Shield v0.1 - Slice 1 acceptance harness. CANDIDATE infrastructure on the
# Shield branch; NOT a promoted P2P workflow.
#
# Purpose: run exactly one thing - the SHIELD-SECRET-01 vertical-slice
# acceptance on a GitHub-hosted runner, because the authoring sandbox cannot
# reach the official provider release host. This is an execution harness, not a
# security platform: no matrix, no cache, no artifact service, no third-party
# actions, no write token, no deployment, no cloud credentials.
#
# Provider policy lives in shield/providers/gitleaks-8.18.4.json and is enforced
# by shield/acquire.py: official release only, exact pinned version, sha256
# verified against the release checksums asset before any execution. No mirrors,
# no auto-upgrade, no source build. If acquisition or verification fails the
# provider is never used and the slice is reported as BLOCKED.
#
# Deliberately plain: single command lines only, so the project's Python modules
# hold the logic and this file holds the wiring. Scratch paths come from the
# runner-provided RUNNER_TEMP variable rather than a context expression.
name: P2P Shield - SHIELD-SECRET-01 slice acceptance

on:
  # Candidate branch only, so acceptance runs before any merge decision.
  push:
    branches:
      - arena/01a0901c-p2p-upgrade-github-1

permissions:
  contents: read

env:
  MAPPING: shield/providers/gitleaks-8.18.4.json
  EXPECTED_PROVIDER_VERSION: 8.18.4

jobs:
  shield-secret-slice:
    name: SHIELD-SECRET-01 via pinned Gitleaks provider
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EVIDENCE_REFERENCE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Acquire and verify the official pinned provider
        continue-on-error: true
        run: python3 -m shield.acquire --mapping "$MAPPING" --provider-dir "$RUNNER_TEMP/p2p-shield-provider" --expected-version "$EXPECTED_PROVIDER_VERSION"

      - name: Run focused Shield contract and provider-acquisition tests
        run: python3 -m unittest -v tests.test_p2p_shield_secret_slice

      - name: Run Slice 1 acceptance against the pinned provider
        if: always()
        run: python3 -m shield.acceptance --executable "$RUNNER_TEMP/p2p-shield-provider/gitleaks" --work-dir "$RUNNER_TEMP/p2p-shield-work" --evidence-dir "$RUNNER_TEMP/p2p-shield-evidence" --evidence-reference "$EVIDENCE_REFERENCE" --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Show the evidence records
        if: always()
        run: cat "$RUNNER_TEMP"/p2p-shield-evidence/slice1-*.json || echo NO_EVIDENCE_RECORDS_WRITTEN
