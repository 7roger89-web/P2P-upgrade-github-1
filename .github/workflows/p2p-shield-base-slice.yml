name: P2P Shield - minimum BASE slice
on:
  push:
    branches: [arena/01a09301-p2p-upgrade-github-1]
permissions:
  contents: read
jobs:
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EVIDENCE_REFERENCE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Focused contracts
        run: python3 -m unittest -v tests.test_p2p_shield_base_slice tests.test_p2p_shield_secret_slice
      - name: Acquire unchanged Gitleaks pin
        continue-on-error: true
        run: python3 -m shield.acquire --mapping shield/providers/gitleaks-8.18.4.json --provider-dir "$RUNNER_TEMP/gitleaks" --expected-version 8.18.4 --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Slice 1 focused acceptance (unchanged)
        run: python3 -m shield.acceptance --executable "$RUNNER_TEMP/gitleaks/gitleaks" --work-dir "$RUNNER_TEMP/slice1-work" --evidence-dir "$RUNNER_TEMP/slice1-evidence" --evidence-reference "$EVIDENCE_REFERENCE" --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Real BASE acceptance
        if: always()
        run: GITLEAKS_EXECUTABLE="$RUNNER_TEMP/gitleaks/gitleaks" python3 -m shield.base_acceptance
