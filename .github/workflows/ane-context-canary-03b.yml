name: ANE Context Canary 03B

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  bounded-selector-retry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANE_HARNESS_CONFIG: ${{ github.workspace }}/control/experiments/ane-context-canary-03b/ane-config.yaml
    steps:
      - name: Checkout canary control files
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: control
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Checkout frozen P2P target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: target
          ref: 6ef4520781350db6f1c870e4cbbfeeaaa4e9c403

      - name: Checkout pinned ANE candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ericlam2k/ane-context-harness
          ref: 26d6fbb7a86fd47e1a3184dc4dc03d3867ac5835
          path: ane-src

      - name: Set up Python 3.13
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install exact upstream candidate
        run: python -m pip install -e "./ane-src[test]"

      - name: Apply exact frozen patch semantics
        working-directory: ane-src
        run: |
          python ../control/experiments/ane-context-canary-03b/apply_patch.py
          git diff --check
          git diff -- src/ane_context_harness/retrieval/selector.py src/ane_context_harness/pipeline.py

      - name: Run focused upstream deterministic checks after patch
        working-directory: ane-src
        run: |
          python -m pytest -q             tests/performance/test_benchmark.py             tests/unit/test_structural.py             tests/unit/test_selector.py

      - name: Run bounded-selector regression
        run: python control/experiments/ane-context-canary-03b/regression.py

      - name: Index exact P2P target
        run: |
          ane-harness index             --repo target             --repo-id p2p-ane-canary-03b             --force-rebuild

      - name: Run exact frozen P2P gate
        run: |
          python - <<'PY'
          import json
          import pathlib
          import statistics
          import subprocess
          import sys

          tasks = [
              json.loads(line)
              for line in pathlib.Path(
                  "control/experiments/ane-context-canary-03b/tasks.jsonl"
              ).read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]

          rows = []
          for item in tasks:
              proc = subprocess.run(
                  [
                      "ane-harness", "select",
                      "--repo-id", "p2p-ane-canary-03b",
                      "--task", item["task"],
                      "--budget", "2000",
                      "--quiet",
                  ],
                  capture_output=True,
                  text=True,
              )
              if proc.returncode != 0:
                  rows.append({
                      "id": item["id"],
                      "anchor": item["anchor"],
                      "select_ok": False,
                      "anchor_present": False,
                      "budget_ok": False,
                      "error_tail": (proc.stderr or proc.stdout)[-1200:],
                  })
                  continue

              payload = json.loads(proc.stdout)
              paths = sorted({e["path"] for e in payload.get("evidence", [])})
              metrics = payload["metrics"]
              diagnostics = metrics.get("diagnostics", {})
              rows.append({
                  "id": item["id"],
                  "anchor": item["anchor"],
                  "select_ok": True,
                  "anchor_present": item["anchor"] in paths,
                  "candidate_tokens": metrics["candidate_tokens"],
                  "selected_tokens": metrics["selected_tokens"],
                  "reduction_percent": metrics["reduction_percent"],
                  "budget_ok": metrics["selected_tokens"] <= 2000,
                  "selected_path_count": len(paths),
                  "broad_symbol_terms":
                      diagnostics.get("named_symbol_broad_terms", []),
              })

          successful = [r for r in rows if r.get("select_ok")]
          median_reduction = (
              statistics.median(r["reduction_percent"] for r in successful)
              if successful else 0.0
          )
          selects_ok = sum(1 for r in rows if r.get("select_ok"))
          anchors_ok = sum(1 for r in rows if r.get("anchor_present"))
          budgets_ok = sum(1 for r in rows if r.get("budget_ok"))
          stage_pass = (
              len(rows) == 5
              and selects_ok == 5
              and anchors_ok == 5
              and budgets_ok == 5
              and median_reduction >= 20.0
          )
          result = {
              "schema": "p2p-ane-context-canary-03b/1",
              "upstream_revision":
                  "26d6fbb7a86fd47e1a3184dc4dc03d3867ac5835",
              "target_revision":
                  "6ef4520781350db6f1c870e4cbbfeeaaa4e9c403",
              "named_symbol_mandatory_max_chunks": 8,
              "frozen_budget": 2000,
              "tasks": len(rows),
              "selects_ok": selects_ok,
              "anchors_ok": anchors_ok,
              "budgets_ok": budgets_ok,
              "median_reduction_percent": median_reduction,
              "stage_pass": stage_pass,
              "real_agent_claim_authorized": False,
              "rows": rows,
          }
          print(json.dumps(result, indent=2))
          with open(
              __import__("os").environ["GITHUB_STEP_SUMMARY"],
              "a",
              encoding="utf-8",
          ) as fh:
              fh.write("# ANE Context Canary 03B\n\n")
              fh.write(f"- selects: {selects_ok}/5\n")
              fh.write(f"- anchors: {anchors_ok}/5\n")
              fh.write(f"- packs <= 2000: {budgets_ok}/5\n")
              fh.write(
                  f"- median local reduction: {median_reduction:.2f}%\n"
              )
              fh.write(f"- PASS: {stage_pass}\n")
          if not stage_pass:
              sys.exit(1)
          PY
