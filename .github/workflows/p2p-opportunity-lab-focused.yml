name: P2P Opportunity Lab acceptance

on:
  pull_request:
    paths:
      - 'experiments/p2p-opportunity-lab/**'
      - '.github/workflows/p2p-opportunity-lab-focused.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Opportunity Lab source
        run: python -m compileall -q experiments/p2p-opportunity-lab/src
      - name: Run Opportunity Lab contract tests
        working-directory: experiments/p2p-opportunity-lab
        run: python -m unittest discover -s tests -p 'test_*.py' -v
