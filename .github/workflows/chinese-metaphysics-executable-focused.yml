name: Chinese Metaphysics Executable Focused
on:
  push:
    branches:
      - research/chinese-metaphysics-upstreams-01
      - control-tower/chinese-metaphysics-live-input-01
      - control-tower/ziwei-qintian-lane-01
      - control-tower/liuyao-multi-read-01
      - control-tower/meihua-number-casting-01
      - control-tower/cegui-convention-integrity-01
      - control-tower/liuyao-yinyo-reasoning-01
      - control-tower/meihua-normalized-case-01
      - control-tower/plum-case-meihua-assembly-01
      - control-tower/plum-case-cegui-assembly-01
      - control-tower/plum-case-ignition-01
      - control-tower/ziwei-zhongzhou-profile-01
      - control-tower/ziwei-profile-to-multilane-01
      - control-tower/meihua-private-surface-guard-01
      - control-tower/ziwei-time-basis-01
      - control-tower/metaphysics-live-road-smoke-01
    paths:
      - 'source/chinese-metaphysics/research/**/run_*_capability.*'
      - 'source/chinese-metaphysics/research/**/run_ziwei_multilane.mjs'
      - 'source/chinese-metaphysics/research/**/run_ziwei_algorithm_compare.mjs'
      - 'source/chinese-metaphysics/research/**/time_basis.mjs'
      - 'source/chinese-metaphysics/research/**/run_liuyao_multi_read.py'
      - 'source/chinese-metaphysics/research/**/run_yinyo_reasoning_lane.py'
      - 'source/chinese-metaphysics/research/**/run_normalized_meihua_case.py'
      - 'source/chinese-metaphysics/research/**/run_plum_case_to_meihua.py'
      - 'source/chinese-metaphysics/research/**/run_plum_case_to_cegui.py'
      - 'source/chinese-metaphysics/research/**/run_plum_case_ignition.py'
      - 'source/chinese-metaphysics/research/**/test_*_capability.*'
      - 'source/chinese-metaphysics/research/**/test_ziwei_multilane.mjs'
      - 'source/chinese-metaphysics/research/**/test_ziwei_algorithm_compare.mjs'
      - 'source/chinese-metaphysics/research/**/test_ziwei_time_basis.mjs'
      - 'source/chinese-metaphysics/research/**/test_liuyao_multi_read.py'
      - 'source/chinese-metaphysics/research/**/test_yinyo_reasoning_lane.py'
      - 'source/chinese-metaphysics/research/**/test_normalized_meihua_case.py'
      - 'source/chinese-metaphysics/research/**/test_plum_case_to_meihua.py'
      - 'source/chinese-metaphysics/research/**/test_plum_case_to_cegui.py'
      - 'source/chinese-metaphysics/research/**/test_plum_case_ignition.py'
      - 'source/chinese-metaphysics/research/run_executable_smoke.sh'
      - '.github/workflows/chinese-metaphysics-executable-focused.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Assert exact upstream pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source/chinese-metaphysics/upstreams/iztro rev-parse HEAD)" = 2c7ef9be669df7b19d1799f4dce335fed3794f78
          test "$(git -C source/chinese-metaphysics/upstreams/liuyao-divination rev-parse HEAD)" = 1a5a78b513c0e7b46dfb29f74043bcf978c32a3e
          test "$(git -C source/chinese-metaphysics/upstreams/yinyo-liuyao rev-parse HEAD)" = 1f67eea0ce5a2c49e6851e4eedce507f9c044dd9
          test "$(git -C source/chinese-metaphysics/upstreams/meihua-yishu rev-parse HEAD)" = 8a9a5e0f482dd225bfe4a1c52c2ae5546228607a
          test "$(git -C source/chinese-metaphysics/upstreams/meihua-divination-skill rev-parse HEAD)" = d70d73ad620afe39d1555a0386680790cfd09227
          test "$(git -C source/chinese-metaphysics/upstreams/plum-cg rev-parse HEAD)" = 509fc43001a503d17a37db07bc56e069b1ff1c4f
          test "$(git -C source/chinese-metaphysics/upstreams/plum-app rev-parse HEAD)" = 5965bdc8e9ca69a3cc7e96be6f1cc585d5032814
      - name: Build iztro
        shell: bash
        run: |
          cd source/chinese-metaphysics/upstreams/iztro
          npm install -g yarn@1.22.22 >/dev/null
          yarn install --frozen-lockfile
          yarn build
      - name: Build plum-cg
        shell: bash
        run: |
          cd source/chinese-metaphysics/upstreams/plum-cg
          npm ci
          npm run build
      - name: Run focused capability tests
        shell: bash
        run: |
          set -euo pipefail
          node source/chinese-metaphysics/research/iztro/test_ziwei_capability.mjs
          node source/chinese-metaphysics/research/iztro/test_ziwei_multilane.mjs
          node source/chinese-metaphysics/research/iztro/test_ziwei_algorithm_compare.mjs
          node source/chinese-metaphysics/research/iztro/test_ziwei_time_basis.mjs
          python source/chinese-metaphysics/research/liuyao-divination/test_liuyao_capability.py
          python source/chinese-metaphysics/research/liuyao-divination/test_liuyao_multi_read.py
          python source/chinese-metaphysics/research/yinyo-liuyao/test_yinyo_reasoning_lane.py
          python source/chinese-metaphysics/research/meihua-yishu/test_meihua_capability.py
          python source/chinese-metaphysics/research/meihua-divination-skill/test_normalized_meihua_case.py
          python source/chinese-metaphysics/research/plum-app/test_plum_case_to_meihua.py
          python source/chinese-metaphysics/research/plum-app/test_plum_case_to_cegui.py
          python source/chinese-metaphysics/research/plum-app/test_plum_case_ignition.py
          node source/chinese-metaphysics/research/plum-cg/test_cegui_capability.mjs
          bash source/chinese-metaphysics/research/run_executable_smoke.sh
