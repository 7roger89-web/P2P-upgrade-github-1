# P2P Shield - BASE acceptance (durable, single live workflow).
# Role: the live CI gate for the SHIELD-BASE candidate. Executes the
# consolidated acceptance evidence for the three required controls
# (SHIELD-SECRET-01, SHIELD-DEPENDENCY-01, SHIELD-CI-01): provider
# acquisition, focused Shield tests, Slice 1 secret acceptance, 3-control
# BASE acceptance, CI PASS/FAIL/BLOCKED/NOT_APPLICABLE acceptance, and the
# current-workflow diagnostic.
# Supersedes the historical session harnesses p2p-shield-secret-slice.yml
# and p2p-shield-base-slice.yml, deleted in the v0.2d promotion-hygiene
# slice after a fresh step-by-step comparison showed no unique required
# acceptance in either of them.
# Provider policy lives in shield/providers/zizmor-1.29.0.json and is enforced by
# shield/zizmor_acquire.py: official release only, exact pinned version, sha256
# verified against GitHub release asset digest before any execution.
# Single workflow, no matrix, no cache, no artifact service, no deployment.

name: P2P Shield - BASE acceptance

on:
  push:
    branches:
      - docs/p2p-shield-plan
      - main
  pull_request:
    branches:
      - docs/p2p-shield-plan
      - main

permissions:
  contents: read

jobs:
  shield-ci-slice:
    name: SHIELD-CI-01 via pinned Zizmor and 3-control BASE
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EVIDENCE_REFERENCE: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      GITLEAKS_MAPPING: shield/providers/gitleaks-8.18.4.json
      ZIZMOR_MAPPING: shield/providers/zizmor-1.29.0.json
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Acquire and verify Gitleaks 8.18.4
        continue-on-error: true
        run: python3 -m shield.acquire --mapping "$GITLEAKS_MAPPING" --provider-dir "$RUNNER_TEMP/gitleaks" --expected-version 8.18.4 --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Acquire and verify Zizmor 1.29.0
        continue-on-error: true
        run: python3 -m shield.zizmor_acquire --provider-dir "$RUNNER_TEMP/zizmor" --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Run focused Shield contract tests
        run: >-
          python3 -m unittest -v
          tests.test_p2p_shield_secret_slice
          tests.test_p2p_shield_base_slice
          tests.test_p2p_shield_ci_slice
          tests.test_p2p_shield_applicability
          tests.test_p2p_prompt_authoring_discipline
          tests.test_p2p_prose_clarity_contract
          tests.test_p2p_project_agents_prompt_preflight
          tests.test_p2p_portable_law_projection
          tests.test_p2p_self_law_propagation_and_fast_sync
          tests.test_p2p_github_connector_capsule
          tests.test_p2p_control_tower_session_handoff
          tests.test_p2p_code_intelligence_bridge
          tests.test_p2p_github_research_appendix
          tests.test_p2p_native_code_impact
          tests.test_p2p_experience_evolution
          tests.test_p2p_experience_federation
          tests.test_p2p_experience_federation_operational
          tests.test_p2p_experience_evolution_distribution
          tests.test_p2p_open_code_review_bridge
          tests.test_p2p_review_extension_activation
          tests.test_p2p_control_tower_context_assembly
          tests.test_p2p_control_tower_self_law_gate

      - name: Run current-main bounded-loop pilot twice
        env:
          PYTHONPATH: .p2p/system:scripts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import shutil
          import tempfile
          from pathlib import Path

          from fw01.p2p_fw01_proof import ProofBackend, ProofVerifier, run_leg

          repo = Path.cwd().resolve()
          expected_leg1 = [
              "TASK_DONE_CONTINUE",
              "TASK_DONE_CONTINUE",
              "TASK_DONE_CONTINUE",
              "PRE_DISPATCH_BLOCKED",
          ]
          expected_leg2 = ["PRE_DISPATCH_BLOCKED"]

          def installed_fixture(root: Path) -> None:
              (root / "workspace").mkdir(parents=True)
              (root / "workspace" / "manifest.json").write_text(
                  json.dumps({"project": "goal-loop-current-main-pilot",
                              "head": "fixture-head-1"}, indent=2),
                  encoding="utf-8",
              )
              p2p = root / ".p2p"
              p2p.mkdir(parents=True)
              os.symlink(repo / ".p2p" / "system", p2p / "system",
                         target_is_directory=True)

          for trial in (1, 2):
              base = Path(tempfile.mkdtemp(prefix=f"p2p-goal-loop-{trial}-"))
              fixture = base / "consumer"
              fixture.mkdir()
              installed_fixture(fixture)

              backend1 = ProofBackend()
              verifier1 = ProofVerifier()
              leg1 = run_leg(fixture, backend1, verifier1, max_steps=8)

              backend2 = ProofBackend()
              verifier2 = ProofVerifier()
              leg2 = run_leg(fixture, backend2, verifier2, max_steps=8)

              evidence = {
                  "trial": trial,
                  "leg1": leg1["status_sequence"],
                  "leg2": leg2["status_sequence"],
                  "leg1_executed": list(backend1.executed),
                  "leg2_executed": list(backend2.executed),
                  "leg1_verifications": list(verifier1.verifications),
                  "leg2_verifications": list(verifier2.verifications),
                  "claim_boundary": "SYNTHETIC_CONTROL_FLOW_ONLY",
              }
              print(json.dumps(evidence, sort_keys=True))

              assert leg1["status_sequence"] == expected_leg1, evidence
              assert leg2["status_sequence"] == expected_leg2, evidence
              assert backend1.executed == ["A", "B", "C"], evidence
              assert backend2.executed == [], evidence
              assert len(verifier1.verifications) == 3, evidence
              assert verifier2.verifications == [], evidence
              shutil.rmtree(base)
          PY

      - name: Measure native code impact on exact PR worktree
        if: github.event_name == 'pull_request'
        env:
          P2P_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: PYTHONPATH=".p2p/system" python3 -m p2p_capabilities.native_code_impact --root . --baseline "$P2P_BASE_SHA"

      - name: Run Slice 1 acceptance (unchanged)
        if: always()
        run: python3 -m shield.acceptance --executable "$RUNNER_TEMP/gitleaks/gitleaks" --work-dir "$RUNNER_TEMP/slice1-work" --evidence-dir "$RUNNER_TEMP/slice1-evidence" --evidence-reference "$EVIDENCE_REFERENCE" --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Run 3-control BASE acceptance (real providers)
        if: always()
        env:
          GITLEAKS_EXECUTABLE: ${{ runner.temp }}/gitleaks/gitleaks
          ZIZMOR_EXECUTABLE: ${{ runner.temp }}/zizmor/zizmor
        run: python3 -m shield.base_acceptance

      - name: Run CI slice acceptance (PASS/FAIL/BLOCKED fixtures + diagnostic)
        if: always()
        run: |
          python3 -m shield.ci_acceptance \
            --executable "$RUNNER_TEMP/zizmor/zizmor" \
            --work-dir "$RUNNER_TEMP/ci-work" \
            --evidence-dir "$RUNNER_TEMP/ci-evidence" \
            --evidence-reference "$EVIDENCE_REFERENCE" \
            --summary-file "$GITHUB_STEP_SUMMARY"

      - name: Show CI evidence records
        if: always()
        run: |
          echo "--- CI evidence ---"
          cat "$RUNNER_TEMP/ci-evidence"/*.json 2>/dev/null || echo "NO_CI_EVIDENCE"
          echo "--- diagnostic ---"
          python3 -m shield.ci --target . --executable "$RUNNER_TEMP/zizmor/zizmor" --reference "$EVIDENCE_REFERENCE" || true
