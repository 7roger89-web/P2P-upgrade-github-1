<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P2P bounded UI fixture — AFTER</title>
<!--
  P2P-IMPECCABLE-01 bounded design-quality fixture (AFTER).
  Minimum correction of before.html driven by the deterministic findings only:
    side-tab            -> accent stripe removed, state carried by a text badge
    gradient-text       -> solid heading colour
    dark-glow           -> neutral elevation shadow
    flat-type-hierarchy -> widened type scale
    monotonous-spacing  -> varied spacing rhythm
    overused-font       -> project system font stack instead of Inter
  No redesign beyond the recorded findings. P2P remains implementation authority.
-->
<style>
body {
  font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  background: #14121a;
  color: #ece6dd;
  margin: 24px;
}
.shell { padding: 32px 24px; }
.panel {
  background: #221d2a;
  border-radius: 14px;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
  padding: 28px;
}
.row { margin-top: 20px; }
.footer { margin-top: 40px; }
h1 { font-size: 34px; color: #f5efe6; margin: 0 0 12px; }
h2 { font-size: 21px; color: #d9c9b4; margin: 0 0 6px; }
h3 { font-size: 15px; color: #b6a894; margin: 0; }
p { font-size: 17px; line-height: 1.6; max-width: 62ch; }
.chip { font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; color: #d9a441; }
.action { min-width: 44px; min-height: 44px; font-size: 16px; padding: 10px 18px; }
</style>
</head>
<body>
<div class="shell">
  <div class="panel">
    <h1>Session status</h1>
    <h2>Current run</h2>
    <h3>Updated just now</h3>
    <p class="chip">Overview</p>
    <div class="row">
      <p>Status readout for the current session. The reading measure is capped so the line stays comfortable, and the leading gives the rows room to breathe.</p>
    </div>
    <button class="action">Continue</button>
  </div>
  <div class="footer"><p>Session footer</p></div>
</div>
</body>
</html>
