<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>P2P bounded UI fixture — BEFORE</title>
<!--
  P2P-IMPECCABLE-01 bounded design-quality fixture (BEFORE).
  Synthetic P2P-owned surface. It is NOT Game Truyen source and is not shipped
  in any product runtime. It deliberately contains generic AI-design problems so
  the pinned deterministic detector has something real to find.
-->
<style>
body {
  font-family: Inter, sans-serif;
  background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  color: #8a8a99;
  margin: 8px;
}
.shell { padding: 8px; margin: 8px; }
.panel {
  background: #1b1b26;
  border-left: 4px solid #7c3aed;
  border-radius: 14px;
  box-shadow: 0 0 24px rgba(124, 58, 237, 0.85);
  padding: 8px;
  margin: 8px;
}
.panel .panel { padding: 8px; margin: 8px; }
.panel .panel .panel { padding: 8px; margin: 8px; }
.row { padding: 8px; margin: 8px; gap: 8px; }
.cell { padding: 8px; margin: 8px; }
.footer { padding: 8px; margin: 8px; }
h1 { font-size: 17px; background: linear-gradient(90deg, #a78bfa, #22d3ee); -webkit-background-clip: text; background-clip: text; color: transparent; }
h2 { font-size: 16px; }
h3 { font-size: 15px; }
p { font-size: 11px; line-height: 1.05; }
.chip { font-size: 10px; letter-spacing: 0.32em; text-transform: uppercase; }
.action { width: 26px; height: 26px; font-size: 10px; }
</style>
</head>
<body>
<div class="shell">
  <div class="panel">
    <div class="panel">
      <div class="panel">
        <span class="chip">OVERVIEW</span>
        <h1>Elevate Your Workflow</h1>
        <h2>Seamlessly Unlock Synergy</h2>
        <h3>Next Generation</h3>
        <div class="row">
          <div class="cell">
            <p>Status readout for the current session. The reading measure here is long enough that the line runs well past a comfortable width, and the leading is tight enough that the rows visually collide.</p>
          </div>
        </div>
        <button class="action">OK</button>
      </div>
    </div>
  </div>
  <div class="footer"><p>Session footer</p></div>
</div>
</body>
</html>
