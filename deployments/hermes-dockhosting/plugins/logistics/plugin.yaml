name: logistics
version: 0.1.0
description: >-
  Read-only Logistics (logistics-work-desk) integration. Answers "what do I
  have to do today" (tasks, with explicit ASSIGNEE vs TEAM scope), "shipment
  status", and freight-rate questions from the Logistics MongoDB. Uses a
  dedicated read-only credential (LOGISTICS_MONGO_URI_READONLY +
  LOGISTICS_MONGO_DB_NAME); the connector exposes find/find_one only, with a
  collection allowlist, and performs no write operations of any kind. The
  verified rate-card schema has no structured origin/destination/container/
  currency fields (route_name is free text), so freight-rate lookup fails
  closed with RATE_CARD_SCHEMA_INSUFFICIENT_FOR_STRUCTURED_ROUTE_LOOKUP
  until a follow-up Logistics schema task provides structured fields.
author: 7roger89-web
kind: backend
requires_env:
  - LOGISTICS_MONGO_URI_READONLY
  - LOGISTICS_MONGO_DB_NAME
provides_tools:
  - logistics_today_work
  - logistics_freight_rate
  - logistics_shipment_status
