name: logistics
version: 0.1.0
description: >-
  Read-only Logistics (logistics-work-desk) integration. Answers "what do I
  have to do today" (tasks, with explicit ASSIGNEE vs TEAM scope), "shipment
  status", and freight-rate questions from the Logistics MongoDB. Uses a
  dedicated read-only credential (LOGISTICS_MONGO_URI_READONLY +
  LOGISTICS_MONGO_DB_NAME); the connector exposes find/find_one only, with a
  collection allowlist, and performs no write operations of any kind.
  Freight lookup queries only structured, non-deleted rate cards
  (structured_lookup_ready == true) and matches the structured route fields
  (route.origin / route.destination plus equipment_type / container_size /
  transport_mode); route_name is a human label and is never parsed. Returns
  selling_price (total_price) as the customer quoted rate, keeps total_cost as
  internal_cost, chooses the latest valid MM/YYYY history month, and reports
  OK / NOT_FOUND / AMBIGUOUS / RATE_HISTORY_NOT_FOUND.
author: 7roger89-web
kind: backend
requires_env:
  - LOGISTICS_MONGO_URI_READONLY
  - LOGISTICS_MONGO_DB_NAME
provides_tools:
  - logistics_today_work
  - logistics_freight_rate
  - logistics_shipment_status
