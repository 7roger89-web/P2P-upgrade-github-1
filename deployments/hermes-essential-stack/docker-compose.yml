name: p2p-hermes-essential-stack

services:
  hermes-agent:
    build:
      context: ../..
      dockerfile: Dockerfile
    command: ["gateway", "run"]
    env_file:
      - .env
    environment:
      HERMES_HOME: /opt/data
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_KEY: ${API_SERVER_KEY:?run stack init first}
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_PORT: "9119"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_BASIC_AUTH_USERNAME:?required}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD:?required}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_BASIC_AUTH_SECRET:?required}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY:-}
    volumes:
      - hermes-data:/opt/data
      - ../hermes-dockhosting/hindsight-p2p-safe.example.json:/opt/p2p/hindsight-safe.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8642/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    ports:
      - "127.0.0.1:8642:8642"
      - "127.0.0.1:9119:9119"

  hermes-workspace:
    build:
      context: ../..
      dockerfile: deployments/hermes-essential-stack/Dockerfile.workspace
      args:
        WORKSPACE_COMMIT: 15fa9cd706f5c04e4db288fb958e21d10fc776da
    image: p2p-hermes-workspace:v2.3.0-15fa9cd
    depends_on:
      hermes-agent:
        condition: service_healthy
    env_file:
      - .env
    environment:
      HERMES_API_URL: http://hermes-agent:8642
      HERMES_API_TOKEN: ${API_SERVER_KEY:?required}
      HERMES_DASHBOARD_URL: http://hermes-agent:9119
      HERMES_DASHBOARD_TOKEN: ${API_SERVER_KEY:?required}
      HERMES_PASSWORD: ${HERMES_PASSWORD:?required}
      COOKIE_SECURE: "0"
      TRUST_PROXY: "0"
      VITE_HERMESWORLD_ENABLED: "0"
    ports:
      - "127.0.0.1:3000:3000"

  hindsight-enable:
    profiles: ["hindsight"]
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      HERMES_HOME: /opt/data
      P2P_ENABLE_HINDSIGHT: ${P2P_ENABLE_HINDSIGHT:-NO}
      HINDSIGHT_API_KEY: ${HINDSIGHT_API_KEY:-}
    volumes:
      - hermes-data:/opt/data
      - ../hermes-dockhosting/hindsight-p2p-safe.example.json:/opt/p2p/hindsight-safe.json:ro
    entrypoint: ["/bin/sh", "-lc"]
    command: >-
      test "$${P2P_ENABLE_HINDSIGHT}" = "YES" ||
      { echo 'HINDSIGHT_NOT_ENABLED: set P2P_ENABLE_HINDSIGHT=YES explicitly'; exit 2; };
      test -n "$${HINDSIGHT_API_KEY}" ||
      { echo 'HINDSIGHT_API_KEY_REQUIRED_FOR_CLOUD_PROFILE'; exit 3; };
      mkdir -p /opt/data/hindsight;
      cp /opt/p2p/hindsight-safe.json /opt/data/hindsight/config.json;
      /opt/hermes/.venv/bin/hermes config set memory.provider hindsight;
      echo 'HINDSIGHT_ENABLED_SAFE_PROFILE:auto_retain=false:auto_recall=false:memory_mode=tools'

  geniex-register:
    profiles: ["geniex"]
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      HERMES_HOME: /opt/data
      P2P_ENABLE_GENIEX: ${P2P_ENABLE_GENIEX:-NO}
      GENIEX_BASE_URL: ${GENIEX_BASE_URL:-}
      GENIEX_MODEL: ${GENIEX_MODEL:-}
    volumes:
      - hermes-data:/opt/data
    entrypoint: ["/bin/sh", "-lc"]
    command: >-
      test "$${P2P_ENABLE_GENIEX}" = "YES" ||
      { echo 'GENIEX_NOT_ENABLED: set P2P_ENABLE_GENIEX=YES explicitly'; exit 2; };
      test -n "$${GENIEX_BASE_URL}" ||
      { echo 'GENIEX_BASE_URL_REQUIRED'; exit 3; };
      test -n "$${GENIEX_MODEL}" ||
      { echo 'GENIEX_MODEL_REQUIRED'; exit 4; };
      /opt/hermes/.venv/bin/python -c 'import json,os,urllib.request; base=os.environ["GENIEX_BASE_URL"].rstrip("/"); model=os.environ["GENIEX_MODEL"]; payload={"model":model,"messages":[{"role":"system","content":"Reply briefly and accurately."},{"role":"user","content":"Reply with OK."}],"max_tokens":8}; req=urllib.request.Request(base+"/chat/completions",data=json.dumps(payload).encode("utf-8"),headers={"Content-Type":"application/json"},method="POST"); body=json.load(urllib.request.urlopen(req,timeout=90)); assert body.get("choices"), body; print("GENIEX_CHAT_SMOKE=PASS")';
      /opt/hermes/.venv/bin/hermes config set providers.geniex.api "$${GENIEX_BASE_URL}";
      /opt/hermes/.venv/bin/hermes config set providers.geniex.transport chat_completions;
      /opt/hermes/.venv/bin/hermes config set providers.geniex.default_model "$${GENIEX_MODEL}";
      /opt/hermes/.venv/bin/hermes config set providers.geniex.discover_models false;
      echo "GENIEX_PROVIDER_REGISTERED:model=$${GENIEX_MODEL}:main_model_unchanged=YES"

  repomix:
    profiles: ["tools"]
    image: node:22-bookworm-slim
    working_dir: /workspace
    volumes:
      - ../..:/workspace:ro
      - repomix-output:/out
    command:
      - npx
      - -y
      - repomix@1.18.0
      - /workspace
      - --output
      - /out/p2p-repomix.md
      - --style
      - markdown
      - --token-budget
      - ${REPOMIX_TOKEN_BUDGET:-200000}

  tokscale:
    profiles: ["tools"]
    image: node:22-bookworm-slim
    environment:
      HERMES_HOME: /opt/data
    volumes:
      - hermes-data:/opt/data:ro
    command: ["npx", "-y", "tokscale@4.16.0", "--json"]

volumes:
  hermes-data:
  repomix-output: